name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1)
          echo "Detected Java string: $JAVA_VER_STRING"

          JAVA_MAJOR=$(echo "$JAVA_VER_STRING" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not detect Java major version from '$JAVA_VER_STRING'"
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version must be 17 or higher (detected: $JAVA_MAJOR)"
            exit 1
          fi

          echo "Java environment verification successful (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Reels Hunter,O=Reels Hunter,C=US"
          else
            echo "Existing debug.keystore found."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::debug.keystore was not created or found."
            exit 1
          fi
          echo "debug.keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK build output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            exit 1
          fi
          echo "Debug APK verified at $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reels-hunter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$RELEASE_DIR"
          
          ASSET_NAME="reels-hunter-v${{ github.run_number }}.apk"
          TARGET_PATH="$RELEASE_DIR/$ASSET_NAME"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_PATH"
          
          if [ ! -f "$TARGET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $TARGET_PATH"
            exit 1
          fi
          
          echo "Release asset prepared: $TARGET_PATH"
          echo "asset_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="reels-hunter-v${{ github.run_number }}.${{ github.run_attempt }}"
          TITLE="Reels Hunter Build #${{ github.run_number }}"
          ASSET_FILE="${{ steps.prepare_asset.outputs.asset_path }}"
          
          NOTES=$(cat << 'EOF'
          ### Reels Hunter Debug Release
          - **App Name**: Reels Hunter
          - Automatically generated build by GitHub Actions.
          - **Run number**: ${{ github.run_number }}
          - **Source commit**: ${{ github.sha }}
          EOF
          )
          
          gh release create "$TAG_NAME" "$ASSET_FILE" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        run: |
          TAG_NAME="reels-hunter-v${{ github.run_number }}.${{ github.run_attempt }}"
          echo "## 🚀 Reels Hunter Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **App Name:** Reels Hunter" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact Name:** \`reels-hunter-debug-apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Tag:** \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build Run:** #${{ github.run_number }} (Attempt ${{ github.run_attempt }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            REPO_URL="${{ github.server_url }}/${{ github.repository }}"
            echo "### 📦 GitHub Release" >> "$GITHUB_STEP_SUMMARY"
            echo "Successfully published to GitHub Releases: [$TAG_NAME]($REPO_URL/releases/tag/$TAG_NAME)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ℹ️ Release Status" >> "$GITHUB_STEP_SUMMARY"
            echo "Release step status: \`${{ steps.create_release.outcome }}\`. Check the uploaded artifact under Actions if release creation was skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
