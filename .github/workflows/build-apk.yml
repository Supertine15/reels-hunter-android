name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "Error: Unable to detect Java version."
            exit 1
          fi
          echo "Detected Java Major Version: $JAVA_MAJOR_VERSION"
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java version must be 17 or higher. Found: $JAVA_MAJOR_VERSION"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Easy Scroll, O=Easy Scroll, C=US"
          else
            echo "Debug keystore already exists."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore generation failed."
            exit 1
          fi

      - name: Sync app version with this build's release tag
        run: |
          NEW_VERSION_CODE="${{ github.run_number }}"
          NEW_VERSION_NAME="${{ github.run_number }}.${{ github.run_attempt }}"
          echo "Setting versionCode=$NEW_VERSION_CODE versionName=$NEW_VERSION_NAME"
          sed -i "s/versionCode = [0-9]\+/versionCode = $NEW_VERSION_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$NEW_VERSION_NAME\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app/build/outputs/apk/debug/app-debug.apk not found!"
            exit 1
          fi
          echo "Verified debug APK exists."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-scroll-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK release asset
        id: prepare_release
        run: |
          TEMP_DIR=$(mktemp -d)
          ASSET_NAME="easy-scroll-v${{ github.run_number }}.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$TEMP_DIR/$ASSET_NAME"
          echo "asset_path=$TEMP_DIR/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="easy-scroll-v${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="Easy Scroll Build #${{ github.run_number }}"
          ASSET_PATH="${{ steps.prepare_release.outputs.asset_path }}"
          
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --latest \
            --notes "$(cat << 'EOF'
          ## App Name: Easy Scroll
          Automatically generated build by GitHub Actions.
          * **Run number**: ${{ github.run_number }}
          * **Source commit**: ${{ github.sha }}
          EOF
          )"

      - name: Report APK download result
        run: |
          echo "### 🚀 Easy Scroll Build & Release Report" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** Easy Scroll" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name:** \`easy-scroll-debug-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Asset:** \`${{ steps.prepare_release.outputs.asset_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`easy-scroll-v${{ github.run_number }}.${{ github.run_attempt }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "- **Status:** ✅ GitHub Release published successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** ⚠️ Artifact uploaded to Actions; Release publish step completed with outcome: \`${{ steps.create_release.outcome }}\`." >> $GITHUB_STEP_SUMMARY
          fi
